<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSINT Mini Toolkit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
          <span class="brand-mark">OM</span>
          <span>
            <strong>OSINT Mini Toolkit</strong>
            <small>Понятная разведка для учебы и защиты</small>
          </span>
        </a>
        <nav>
          <a href="#username">Ник</a>
          <a href="#domain">Домен</a>
          <a href="#metadata">Файл</a>
          <a href="#web-security">Pentest</a>
        </nav>
      </header>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
